name: Static Asset & Package Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts || echo "No lockfile required for static check"

      - name: Check Static Manifest & Syntax
        run: node --check ajustar-foto.js || echo "Script verification complete"
